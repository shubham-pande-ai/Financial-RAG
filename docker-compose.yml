version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: finrag_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: finrag_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mysql:
    image: mysql:8.0
    container_name: finrag_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=quant_password
      - MYSQL_DATABASE=ai_hedge_fund
      - MYSQL_USER=quant_user
      - MYSQL_PASSWORD=quant_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  qdrant_data:
  minio_data:
  mysql_data:
